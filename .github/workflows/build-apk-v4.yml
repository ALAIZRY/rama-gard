name: Build Android APK - Barcode Scanner V4

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8 @capacitor/share@^8 @capacitor/filesystem@^8 @capacitor/barcode-scanner@^3
      - name: Validate TypeScript and web build
        run: npm run build
      - name: Init Capacitor
        run: npx cap init "Rama Gard" "com.ramagard.app" --web-dir dist || true
      - name: Generate clean Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Add camera permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
          additions='    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera.any" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n'
          if 'android.permission.CAMERA' not in s:
              s=s.replace(marker, marker+additions)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rama-gard-v4
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
