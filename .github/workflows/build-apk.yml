name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Stabilize Android camera scanner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/CameraBarcodeScanner.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("}, [isOpen, selectedDeviceId]);", "}, [isOpen]);")
          s = s.replace("const hasNativeBarcodeDetector = 'BarcodeDetector' in window;", "const hasNativeBarcodeDetector = 'BarcodeDetector' in window && !(window as any).Capacitor;")
          p.write_text(s, encoding='utf-8')
          print('Camera scanner Android lifecycle/fallback patch applied')
          PY

      - name: Build Web Assets
        run: npm run build

      - name: Init Capacitor
        run: |
          npx cap init "Rama Gard" "com.ramagard.app" --web-dir dist || true

      - name: Generate clean Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Ensure camera permissions in generated Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          camera = '    <uses-permission android:name="android.permission.CAMERA" />\n'
          feature = '    <uses-feature android:name="android.hardware.camera.any" android:required="false" />\n'
          autofocus = '    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n'
          if 'android.permission.CAMERA' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + camera)
          if 'android.hardware.camera.any' not in s:
              s = s.replace(camera, camera + feature + autofocus)
          p.write_text(s, encoding='utf-8')
          print(p.read_text(encoding='utf-8'))
          PY

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rama-gard-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
